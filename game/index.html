<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cogsworth: Last Wind</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Constants -->
    <script src="src/constants.js"></script>

    <!-- Level data -->
    <script src="src/data/levels.js"></script>
    <script src="src/data/SaveManager.js"></script>

    <!-- Entity classes -->
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/Enemy.js"></script>
    <script src="src/entities/Coin.js"></script>
    <script src="src/entities/MovingPlatform.js"></script>
    <script src="src/entities/Obstacle.js"></script>

    <!-- UI components -->
    <script src="src/ui/TouchControls.js"></script>
    <script src="src/ui/Utils.js"></script>

    <!-- Scenes -->
    <script src="src/scenes/BootScene.js"></script>
    <script src="src/scenes/PreloadScene.js"></script>
    <script src="src/scenes/MainMenuScene.js"></script>
    <script src="src/scenes/ModeSelectScene.js"></script>
    <script src="src/scenes/SlotSelectScene.js"></script>
    <script src="src/scenes/LevelSelectScene.js"></script>
    <script src="src/scenes/GameScene.js"></script>
    <script src="src/scenes/HUDScene.js"></script>
    <script src="src/scenes/LevelCompleteScene.js"></script>
    <script src="src/scenes/GameOverScene.js"></script>
    <script src="src/scenes/WinScene.js"></script>

    <!-- Game config and entry point -->
    <script src="src/config.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
